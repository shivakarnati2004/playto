services:
  # Single service: Django serves both the API and the React frontend
  - type: web
    name: playto-kyc
    env: python
    buildCommand: >
      cd frontend && npm install && npm run build &&
      cd ../backend && pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python seed.py
    startCommand: "cd backend && gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 2 config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: playto-kyc-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      # ── Set these in the Render dashboard ──
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OTP_EXPIRY_MINUTES
        value: "10"
      - key: OTP_LENGTH
        value: "6"
      - key: DB_SSL
        value: "false"
      - key: NODE_VERSION
        value: "18"

databases:
  - name: playto-kyc-db
    databaseName: playto
    user: postgres
